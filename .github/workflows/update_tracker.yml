name: Update Tracker & README

on:
  push:
    paths:
      - "solutions/**.py"
  pull_request:
    paths:
      - "solutions/**.py"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated files back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git push works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update_tracker.py
        run: python scripts/update_tracker.py

      - name: Commit changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker/problems.json README.md company/ topics/
          git diff --cached --quiet || git commit -m "chore: auto-update tracker + README [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
